name: Code Quality Checks

on:
  push:
    branches: "*"
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: test_fixlogback
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DJANGO_SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost"
      POSTGRES_DB: "test_fixlogback"
      POSTGRES_DB_TEST: "test_fixlogback_test"
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: "localhost"
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8000"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Install Packages & Libraries
        run: |
          poetry install --no-root

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h 127.0.0.1 -U $POSTGRES_USER -d $POSTGRES_DB_TEST; do
            echo "Waiting for test DB $POSTGRES_DB_TEST..."
            sleep 2
          done

      - name: Run Black
        run: poetry run black . --check

      - name: Run Isort
        run: poetry run isort . --check-only

      - name: Create test database
        env:
          PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          psql -h localhost -U $POSTGRES_USER -d postgres -c "DROP DATABASE IF EXISTS $POSTGRES_DB_TEST;"
          psql -h localhost -U $POSTGRES_USER -d postgres -c "CREATE DATABASE $POSTGRES_DB_TEST;"

      - name: Make Migrations
        run: |
          poetry run python manage.py makemigrations util
          poetry run python manage.py makemigrations accounts  
          poetry run python manage.py makemigrations fixred
          poetry run python manage.py makemigrations crew
          poetry run python manage.py makemigrations workroom
          poetry run python manage.py makemigrations fixletter
          poetry run python manage.py makemigrations

      - name: Run Django Migration
        run: poetry run python manage.py migrate

      - name: Run Tests
        run: poetry run python manage.py test
