name: Deploy to EC2 via Docker

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: seonhongmun/fixlog-api:prod-latest

      - name: Build and Push Daphne
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: seonhongmun/fixlog-daphne:prod-latest

      - name: Build and Push Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile # nginx 설정 도커파일 따로
          push: true
          tags: seonhongmun/fixlog-nginx:prod-latest

      - name: SSH and deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "배포 준비 중..."
            cd /home/ec2-user/fixlog_back

            echo "최신 코드 동기화"
            git reset --hard HEAD
            git clean -fd
            git pull origin release

            echo "도커 로그인 (EC2 내부)"
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "디스크 용량 확인"
            df -h
            docker system df || true

            echo "컨테이너 종료"
            docker compose -f docker-compose.prod.yml down || true

            echo "불필요 리소스 정리"
            docker system prune -af || true

            echo "이미지 풀 (compose로 일괄 처리)"
            docker compose -f docker-compose.prod.yml pull --quiet

            echo "서비스 재기동"
            docker compose -f docker-compose.prod.yml up -d

            echo "상태 점검"
            docker compose -f docker-compose.prod.yml ps
            docker logs --tail=100 fixlog-api || true
            docker logs --tail=100 fixlog-daphne || true
            docker logs --tail=100 fixlog-nginx || true

            echo "배포 완료"