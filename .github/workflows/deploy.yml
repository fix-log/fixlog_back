name: Deploy to EC2 via Docker

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            rubyhae/fixlog:prod-latest
            rubyhae/fixlog:latest
          no-cache: true

      - name: SSH and deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "📦배포 준비 중..."
            cd /home/ubuntu/fixlog-project

            # 최신 코드 반영
            git pull origin release

            # 새로운 버전(api-green) 컨테이너 실행
            docker compose -f docker-compose.prod.yml up -d --build api-green

            # Nginx 설정의 upstream을 green으로 전환
            sed -i 's/api-blue/api-green/g' ./nginx/nginx.conf
            docker exec nginx nginx -s reload

            # 문제가 없다면 blue 컨테이너 종료
            docker compose rm -sf api-blue

            echo "✅배포 완료"name: Deploy to EC2 via Docker