name: Deploy to EC2 via Docker

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: seonhongmun/fixlog-api:prod-latest

      - name: Build and Push Daphne
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: seonhongmun/fixlog-daphne:prod-latest

      - name: Build and Push Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile # nginx 설정 도커파일 따로
          push: true
          tags: seonhongmun/fixlog-nginx:prod-latest

      - name: SSH and deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "📦배포 준비 중..."
            cd /home/ubuntu/fixlog-project

            # 최신 코드 반영
            git pull origin release

            # DockerHub에서 모든 서비스 이미지 pull
            docker pull seonhongmun/fixlog-api:prod-latest
            docker pull seonhongmun/fixlog-daphne:prod-latest
            docker pull seonhongmun/fixlog-nginx:prod-latest

            # 컨테이너 전체 재시작
            docker compose -f docker-compose.prod.yml up -d

            echo "✅배포 완료"