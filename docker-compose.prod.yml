version: '3.8'

services:
  # --------------------------------------------
  # 1) Redis (캐시 & 채널 레이어용)
  # --------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  # --------------------------------------------
  # 2) Daphne (ASGI: WebSocket 처리)
  # --------------------------------------------
  daphne:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "./scripts/run_daphne.sh"
    env_file:
      - .env.prod
    volumes:
      - .:/app
    environment:
      PYTHONPATH: /app/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: always

  # --------------------------------------------
  # 3) API (Gunicorn WSGI: HTTP 요청 처리)
  # --------------------------------------------
  api-blue:
    build:
      context: .
    command: >
      sh ./scripts/run_api.sh
    volumes:
      - .:/app
    env_file:
      - .env.prod
    ports:
      - "8001:8001"
    depends_on:
      - redis
    restart: always

  api-green:
    build:
      context: .
    command: >
      sh ./scripts/run_api.sh
    volumes:
      - .:/app
    env_file:
      - .env.prod
    ports:
      - "8002:8001"  # host만 다르게
    depends_on:
      - redis
    restart: always

  # --------------------------------------------
  # 4) Nginx (리버스 프록시 & 정적파일 서빙)
  # --------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static
    depends_on:
      - daphne
      - api-blue
      - api-green
    restart: always

volumes:
  static_volume: {}
