worker_processes 1;                                   # 워커 프로세스 수를 1개로 설정한다 (개발 환경 단순화 목적)

events {                                              # 이벤트 블록을 선언한다
    worker_connections 1024;                          # 워커당 최대 연결 수를 1024로 설정한다
}

http {                                                # HTTP 설정 블록을 연다
    include       /etc/nginx/mime.types;              # MIME 타입 정의 파일을 포함한다
    default_type  application/octet-stream;           # 기본 MIME 타입을 octet-stream으로 설정한다
    sendfile      on;                                 # sendfile을 활성화하여 파일 전송 성능을 높인다

    gzip on;                                          # gzip 압축을 활성화한다
    gzip_types text/plain application/json application/javascript text/css application/xml text/javascript; # gzip 대상 MIME 타입을 지정한다

    upstream daphne_ws {                              # WebSocket용 업스트림을 정의한다
        server daphne:8000;                           # Daphne 컨테이너의 8000 포트를 대상으로 설정한다
    }

    upstream api {                                    # Django API용 업스트림을 정의한다
        server api:8001;                              # API 컨테이너의 8001 포트를 대상으로 설정한다
    }

    server {                                          # 단일 서버 블록을 선언한다 (개발용 무SSL)
        listen 80;                                    # 80 포트(HTTP)로 요청을 수신한다
        listen [::]:80;                               # IPv6 80 포트도 수신한다
        server_name _;                                # 모든 호스트명을 수용하도록 설정한다 (개발 환경 단순화)

        location /ws/ {                               # WebSocket 요청 경로를 처리한다
            proxy_pass http://daphne_ws;              # daphne_ws 업스트림으로 요청을 전달한다
            proxy_http_version 1.1;                   # HTTP/1.1을 사용하여 업그레이드를 지원한다
            proxy_set_header Upgrade $http_upgrade;   # WebSocket 업그레이드를 설정한다
            proxy_set_header Connection "upgrade";    # 연결을 업그레이드로 표시한다
            proxy_set_header Host $host;              # 원본 Host 헤더를 전달한다
            proxy_set_header X-Real-IP $remote_addr;  # 클라이언트 IP를 전달한다
            proxy_read_timeout 300;                   # WebSocket 읽기 타임아웃을 300초로 설정한다
        }

        location / {                                  # 기본 경로(API 요청)를 처리한다
            proxy_pass http://api;                    # api 업스트림으로 요청을 전달한다
            proxy_set_header Host $host;              # 원본 Host 헤더를 전달한다
            proxy_set_header X-Real-IP $remote_addr;  # 클라이언트 IP를 전달한다
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # 프록시 체인 IP를 전달한다
            proxy_set_header X-Forwarded-Proto $scheme; # 원본 프로토콜을 전달한다
        }

        error_page 500 502 503 504 /50x.html;         # 5xx 에러 페이지 경로를 지정한다
        location = /50x.html {                        # 5xx 에러 페이지 정적 파일 위치를 지정한다
            root /usr/share/nginx/html;               # Nginx 기본 정적 파일 디렉터리를 사용한다
        }
    }
}