worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # 성능 향상을 위한 gzip 압축 활성화
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml text/javascript;

    # 백엔드 서버 연결
    upstream daphne_ws {
        server daphne:8000;
    }

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.fixlog.co.kr;

    ssl_certificate /etc/letsencrypt/live/api.fixlog.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fixlog.co.kr/privkey.pem;

    # WebSocket 요청은 Daphne가 처리
    location /ws/ {
        proxy_pass http://daphne_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300;
    }

    # 모든 요청은 api 컨테이너로 전달
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 에러 페이지
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        }
    }  # server 블록 종료
}  # http 블록 종료