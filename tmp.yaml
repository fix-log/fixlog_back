components:
  schemas:
    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        workroom:
          type: integer
        title:
          type: string
          maxLength: 255
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        all_day:
          type: boolean
        recurrence: {}
        color:
          type: string
          maxLength: 7
        alert:
          type: boolean
        location:
          type: string
          maxLength: 255
        url:
          type: string
          format: uri
          maxLength: 200
        memo:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: 작성일자
      required:
      - color
      - created_at
      - end
      - id
      - start
      - title
      - workroom
    Design:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    Issue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
